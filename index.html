<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance System</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background-gradient">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="brand">
                    <i class="bi bi-clock-history"></i>
                    <span>Attendance System</span>
                </div>
                <div class="live-time" id="liveTime">
                    <i class="bi bi-clock"></i>
                    <span id="timeDisplay">--:--:--</span>
                </div>
            </div>
        </header>

        <!-- Attendance Card -->
        <div class="attendance-card" id="attendanceCard">
            <div class="card-header">
                <h1 class="card-title">Employee Check-In</h1>
                <p class="card-subtitle" id="greetingText">Good day! Please complete your attendance</p>
            </div>

            <!-- Employee Status Badge -->
            <div class="status-badge" id="statusBadge" style="display: none;">
                <i class="bi bi-info-circle"></i>
                <span id="statusText">Ready to check in</span>
            </div>

            <!-- Form -->
            <form id="attendanceForm" class="attendance-form">
                <!-- Employee Selection -->
                <div class="form-group">
                    <label for="employeeName" class="form-label">
                        <i class="bi bi-person"></i>
                        Employee Name
                    </label>
                    <select id="employeeName" class="form-input" required>
                        <option value="">Select your name</option>
                    </select>
                    <span class="form-error" id="employeeError"></span>
                </div>

                <!-- Location Selection -->
                <div class="form-group">
                    <label for="location" class="form-label">
                        <i class="bi bi-geo-alt"></i>
                        Location
                    </label>
                    <select id="location" class="form-input" required>
                        <option value="">Select location</option>
                    </select>
                    <span class="form-error" id="locationError"></span>
                </div>

                <!-- Camera Section -->
                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-camera"></i>
                        Live Photo Capture
                        <span class="required-badge">Required</span>
                    </label>
                    
                    <div class="camera-container" id="cameraContainer">
                        <video id="cameraPreview" class="camera-preview" autoplay playsinline></video>
                        <canvas id="canvas" style="display: none;"></canvas>
                        <img id="photoPreview" class="photo-preview" style="display: none;" alt="Captured photo">
                        
                        <div class="camera-overlay" id="cameraOverlay">
                            <i class="bi bi-camera-video"></i>
                            <p>Camera not activated</p>
                        </div>
                    </div>

                    <div class="camera-controls">
                        <button type="button" id="openCameraBtn" class="btn btn-secondary">
                            <i class="bi bi-camera-video"></i>
                            <span>Open Camera</span>
                        </button>
                        <button type="button" id="captureBtn" class="btn btn-secondary" style="display: none;">
                            <i class="bi bi-camera"></i>
                            <span>Capture Photo</span>
                        </button>
                        <button type="button" id="retakeBtn" class="btn btn-outline" style="display: none;">
                            <i class="bi bi-arrow-clockwise"></i>
                            <span>Retake</span>
                        </button>
                    </div>
                    <span class="form-error" id="photoError"></span>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons" id="actionButtons">
                    <button type="button" id="timeInBtn" class="btn btn-primary" disabled>
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span>Time In</span>
                    </button>
                    <button type="button" id="timeOutBtn" class="btn btn-danger" style="display: none;" disabled>
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Time Out</span>
                    </button>
                </div>
            </form>

            <!-- Current Date Display -->
            <div class="date-display">
                <i class="bi bi-calendar3"></i>
                <span id="currentDate">--</span>
            </div>
        </div>
    </main>

    <!-- Loading Modal -->
    <div class="modal" id="loadingModal">
        <div class="modal-content loading-content">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Processing...</p>
            <p class="loading-subtext">Please do not close this window</p>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content success-content">
            <div class="success-icon">
                <i class="bi bi-check-circle"></i>
            </div>
            <h3 class="modal-title" id="successTitle">Success!</h3>
            <p class="modal-message" id="successMessage">Your attendance has been recorded</p>
            <button type="button" class="btn btn-primary" id="successOkBtn">
                <span>OK</span>
            </button>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="modal" id="errorModal">
        <div class="modal-content error-content">
            <div class="error-icon">
                <i class="bi bi-x-circle"></i>
            </div>
            <h3 class="modal-title" id="errorTitle">Error</h3>
            <p class="modal-message" id="errorMessage">Something went wrong</p>
            <button type="button" class="btn btn-primary" id="errorOkBtn">
                <span>Try Again</span>
            </button>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content confirm-content">
            <div class="confirm-icon">
                <i class="bi bi-question-circle"></i>
            </div>
            <h3 class="modal-title" id="confirmTitle">Confirm Action</h3>
            <p class="modal-message" id="confirmMessage">Are you sure?</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="confirmCancelBtn">
                    <span>Cancel</span>
                </button>
                <button type="button" class="btn btn-primary" id="confirmOkBtn">
                    <span>Confirm</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
